services:
  testhost:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "2222:22"
    privileged: true
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    healthcheck:
      test: ["CMD", "systemctl", "is-active", "ssh"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
