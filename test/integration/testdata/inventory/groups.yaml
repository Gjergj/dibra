all:
  vars:
    env: default
  children:
    webservers:
      hosts:
        testhost:
          host: localhost
          port: 2222
          user: root
          ssh_pass: rootpass
          become: true
          become_password: rootpass
          custom_var: from_host
      vars:
        http_port: 80
        role: web
    dbservers:
      hosts:
        testhost:
          db_port: 5432
      vars:
        role: db
