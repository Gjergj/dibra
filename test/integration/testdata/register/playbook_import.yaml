hosts:
  - name: testhost
    host: localhost
    port: 2222
    user: root
    password: rootpass
    become: true

tasks:
  - name: Run before import
    shell:
      cmd: echo before_import
    register: before_result

  - name: Import tasks
    import_tasks: imported_tasks.yaml

  - name: Write combined
    copy:
      content: "before={{ before_result.stdout }} imported={{ imported_result.stdout }}"
      dest: /tmp/dibra-register-import-combined.txt
      mode: "0644"
