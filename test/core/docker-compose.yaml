services:
  corehost:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${DIBRA_CORE_SSH_PORT:-2223}:22"
    privileged: true
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    networks:
      - core-testnet
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active --quiet ssh"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    depends_on:
      httpbin:
        condition: service_started

  httpbin:
    image: mccutchen/go-httpbin:2.18.0
    environment:
      - PORT=80
    networks:
      - core-testnet

networks:
  core-testnet:
    driver: bridge
