# 1Password Secrets Example
# Requires: op CLI installed with active session (or OP_SERVICE_ACCOUNT_TOKEN set)
#
# Usage:
#   dibra -config playbook.yaml -i samples/variables/inventory_onepassword.yaml
#
# The !op:// prefix fetches secrets from 1Password using native secret references.
# Format: !op://vault/item/field
all:
  vars:
    ssh_password: "!op://Infrastructure/webserver-ssh/password"
    api_key: "!op://Infrastructure/webserver-ssh/api_key"
  hosts:
    webserver:
      host: 192.168.1.10
      user: deploy
      ssh_pass: "{{ ssh_password }}"
      become_password: "{{ ssh_password }}"
