# Variables Example Playbook
#
# Demonstrates all variable features in Dibra:
#   - Playbook-level vars and vars_files
#   - Group and host vars (auto-loaded from group_vars/ and host_vars/)
#   - Task-level vars
#   - Extra vars from CLI (-e key=value or -e @file.yml)
#   - Variable namespaces (vars.group, vars.host, vars.play, vars.task, vars.extra)
#   - Magic variables (inventory_hostname, group_names, groups, hostvars)
#   - Nested variable access (dot and bracket notation)
#   - vars_merge strategy (replace or merge)
#
# Usage:
#   dibra -config samples/variables/playbook.yaml -e env=production
#   dibra -config samples/variables/playbook.yaml -e @samples/variables/extra.yml

vars_merge: merge

vars:
  app:
    name: "myapp"
    port: 8080
    log_level: "info"
  deploy_dir: "/opt/{{ app.name }}"

vars_files:
  - defaults.yml

hosts:
  - name: web1
    host: 192.168.1.10
    port: 22
    user: deploy
    password: "changeme"
    become: true
    become_password: "changeme"
    groups:
      - web
      - prod

tasks:
  # 1. Create deployment directory using a variable
  - name: Create app directory
    file:
      path: "{{ deploy_dir }}"
      state: directory
      mode: "0755"

  # 2. Deploy config using play vars, group vars, and host vars
  - name: Deploy application config
    copy:
      content: |
        # Application Configuration
        # Generated by Dibra for {{ inventory_hostname }}

        [app]
        name = {{ app.name }}
        port = {{ app.port }}
        log_level = {{ app.log_level }}
        max_connections = {{ max_connections }}

        [deploy]
        dir = {{ deploy_dir }}
        host = {{ inventory_hostname }}
        groups = {{ group_names[0] }}
      dest: "{{ deploy_dir }}/config.ini"
      mode: "0644"

  # 3. Task-level vars override play vars for this task only
  - name: Deploy debug config
    vars:
      debug_mode: "true"
      app:
        log_level: "debug"
    copy:
      content: |
        # Debug override: log_level={{ app.log_level }}
        # Task namespace: {{ vars.task.debug_mode }}
        # Play namespace still visible: {{ vars.play.app.name }}
      dest: "{{ deploy_dir }}/debug.ini"
      mode: "0644"

  # 4. Use magic variables for multi-host awareness
  - name: Write host info
    copy:
      content: |
        hostname={{ inventory_hostname }}
        groups={{ group_names[0] }}
        all_web_hosts={{ groups.web[0] }}
        self_port={{ hostvars[inventory_hostname].app.port }}
      dest: "{{ deploy_dir }}/hostinfo.txt"
      mode: "0644"
