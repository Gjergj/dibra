# include:
#   - ./test_config_include.yml

secrets:
  adapter: bitwarden
  list:
    SSH_USER: social_posts/username
    SSH_PASSWORD: social_posts/password
    SSH_HOST: social_posts/host
    SSH_KEY_PATH: social_posts/keypath
    SSH_PORT: social_posts/port

variables:
  YTDLP_REMOTEPATH: /home/testuser/yt-dlp

inventory:
  group_BE:
    testmachine2:
      host: ${SSH_HOST}
      user: ${SSH_USER}
      port: ${SSH_PORT}
      key_path: ${SSH_KEY_PATH} 
      password: ${SSH_PASSWORD}
      timeout: 30
      allow_insecure: true

tasks:
  - hosts:
      - group_BE
    disabled: true
    systemd:
      operation: stop
      name: myapp
      description: My Custom Application Service
      # user: testuser
      # exec_start: /home/testuser/myapp
      # working_dir: /home/testuser
      env:
        port: 8080
        env: production
      artifacts:
        - type: local
          path: /Users/gjergjiramku/projekte/social_posts/bin/social_posts
          remote_path: ${TASK_EXEC_PATH}
          constraints:
            executable: true
            force: true
        - type: local
          path: /Users/gjergjiramku/projekte/social_posts/bin/yt-dlp_linux
          remote_path: ${TASK_WORKDIR}/yt-dlp
          constraints:
            executable: true
  - hosts:
      - group_BE
    disabled: true
    artifacts:
      - type: local
        content: |
          #!/bin/bash
          echo "Hello, World!"
        remote_path: /home/testuser/test_script
        constraints:
          executable: true
  - hosts:
      - group_BE
    artifacts:
      - type: local
        path: /Users/gjergjiramku/projekte/seemenow/web/dist
        remote_path: /home/testuser/web
        constraints:
          force: true
