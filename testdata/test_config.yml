machine_name: testmachine

secrets:
  adapter: bitwarden
  list:
    SSH_USER: social_posts/username
    SSH_PASSWORD: social_posts/password
    SSH_HOST: social_posts/host
    SSH_KEY_PATH: social_posts/keypath
    SSH_PORT: social_posts/port

variables:
  YTDLP_REMOTEPATH: /home/testuser/yt-dlp

ssh:
  host: ${SSH_HOST}
  user: ${SSH_USER}
  port: ${SSH_PORT}
  key_path: ${SSH_KEY_PATH} 
  password: ${SSH_PASSWORD}
  timeout: 30
  allow_insecure: true

# ssh:
#   host: localhost
#   user: testuser
#   port: 32222
#   key_path: /Users/gjergjiramku/.orbstack/ssh/id_ed25519 #~/.ssh/id_rsa
#   password: 1234
#   timeout: 30
#   allow_insecure: true

artifacts:
  - type: local
    path: /Users/gjergjiramku/projekte/social_posts/bin/social_posts
    remote_path: ${YTDLP_REMOTEPATH}
    constraints:
      if_remote_not_exists: ${YTDLP_REMOTEPATH}
      executable: true

service:
  type: systemd
  operation: stop
  systemd:
    name: myapp
    description: My Custom Application Service
    bin_path: /home/testuser
    user: testuser
    working_dir: /home/testuser
    env:
      port: 8080
      env: production
  artifacts:
    - type: local
      path: /Users/gjergjiramku/projekte/social_posts/bin/social_posts
      remote_path: /home/testuser/myapp
      constraints:
        executable: true
    - type: local
      path: /Users/gjergjiramku/projekte/social_posts/bin/yt-dlp_linux
      remote_path: ${YTDLP_REMOTEPATH}
      constraints:
        if_remote_not_exists: ${YTDLP_REMOTEPATH}
        executable: true
