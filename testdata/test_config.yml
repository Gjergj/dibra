machine_name: testmachine
ssh:
  host: localhost
  user: testuser
  port: 32222
  key_path: /Users/gjergjiramku/.orbstack/ssh/id_ed25519 #~/.ssh/id_rsa
  password: 1234
  timeout: 30
  allow_insecure: true

service:
  type: systemd
  operation: stop
  systemd:
    name: myapp
    description: My Custom Application Service
    bin_path: /home/testuser
    user: testuser
    working_dir: /home/testuser
    env:
      port: 8080
      env: production
  artifacts:
    - type: local
      path: /Users/gjergjiramku/projekte/social_posts/bin/social_posts
      remote_path: /home/testuser/myapp
      constraints:
        executable: true
    - type: local
      path: /Users/gjergjiramku/projekte/social_posts/bin/yt-dlp_linux
      remote_path: /home/testuser/yt-dlp
      constraints:
        if_remote_not_exists: "{{.remote_path}}"
        executable: true
