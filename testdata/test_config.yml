# include:
#   - ./test_config_include.yml

secrets:
  adapter: bitwarden
  list:
    SSH_USER: social_posts/username
    SSH_PASSWORD: social_posts/password
    SSH_HOST: social_posts/host
    SSH_KEY_PATH: social_posts/keypath
    SSH_PORT: social_posts/port
    SSD_NODES_PASSWORD: vps_ssd_nodes/password

variables:
  YTDLP_REMOTEPATH: /home/testuser/yt-dlp

inventory:
  group_BE:
    testmachine2:
      host: ${SSH_HOST}
      user: ${SSH_USER}
      port: ${SSH_PORT}
      key_path: ${SSH_KEY_PATH} 
      password: ${SSH_PASSWORD}
      timeout: 30
      allow_insecure: true
  real_vps:
    sdd_nodes:
      host: 89.233.108.20
      user: root
      port: 22
      password: ${SSD_NODES_PASSWORD}
      timeout: 30

tasks:
  - hosts:
      - group_BE
    disabled: true
    systemd:
      operation: stop
      name: myapp
      description: My Custom Application Service
      # user: testuser
      # exec_start: /home/testuser/myapp
      # working_dir: /home/testuser
      env:
        port: 8080
        env: production
      artifacts:
        - type: local
          path: /Users/gjergjiramku/projekte/social_posts/bin/social_posts
          remote_path: ${TASK_EXEC_PATH}
          constraints:
            executable: true
            force: true
        - type: local
          path: /Users/gjergjiramku/projekte/social_posts/bin/yt-dlp_linux
          remote_path: ${TASK_WORKDIR}/yt-dlp
          constraints:
            executable: true
  - hosts:
      - group_BE
    disabled: true
    artifacts:
      - type: local
        content: |
          #!/bin/bash
          echo "Hello, World!"
        remote_path: /home/testuser/test_script
        constraints:
          executable: true
  - hosts:
      - group_BE
    disabled: true
    artifacts:
      - type: local
        path: /Users/gjergjiramku/projekte/seemenow/web/dist
        remote_path: /home/testuser/web
        constraints:
          force: true
  - hosts:
      - sdd_nodes
    artifacts:
      - type: local
        content: >-
          :80 {
            header Content-Type text/html
            respond <<HTML
              <html>
                <head><title>Foo</title></head>
                <body>Foo</body>
              </html>
              HTML 200
          }
        remote_path: /etc/caddy/Caddyfile
        constraints:
          force: true