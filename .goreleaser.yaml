# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: dibra

before:
  hooks:
    - go mod tidy

builds:
  - id: controller
    main: ./cmd/controller
    binary: dibra
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/gjergjiramku/dibra/internal/version.Version={{.Version}}
      - -X github.com/gjergjiramku/dibra/internal/version.Commit={{.Commit}}
      - -X github.com/gjergjiramku/dibra/internal/version.Date={{.Date}}

  - id: agent
    main: ./cmd/agent
    binary: dibra-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/gjergjiramku/dibra/internal/version.Version={{.Version}}
      - -X github.com/gjergjiramku/dibra/internal/version.Commit={{.Commit}}
      - -X github.com/gjergjiramku/dibra/internal/version.Date={{.Date}}

archives:
  - id: controller-archive
    ids:
      - controller
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

  - id: agent-archive
    ids:
      - agent
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

# Homebrew tap
homebrew_casks:
  - name: dibra
    ids:
      - controller-archive
    repository:
      owner: Gjergj
      name: dibra
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/Gjergj/dibra"
    description: "A minimal Ansible-like configuration management tool written in Go"
    license: "MIT"
    # test: |
    #   system "#{bin}/dibra", "--version"
    # install: |
    #   bin.install "dibra"

# Scoop (Windows package manager)
scoops:
  - name: dibra
    ids:
      - controller-archive
    repository:
      owner: Gjergj
      name: dibra
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: "https://github.com/Gjergj/dibra"
    description: "A minimal Ansible-like configuration management tool written in Go"
    license: "MIT"

