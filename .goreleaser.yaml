# Linux packages (deb/rpm)
nfpms:
  - id: dibra
    package_name: dibra
    ids:
      - controller
    vendor: Gjergj Ramku
    homepage: "https://github.com/Gjergj/dibra"
    maintainer: "Gjergj Ramku <gjergj@example.com>"
    description: "A minimal Ansible-like configuration management tool written in Go"
    license: "MIT"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: admin
    priority: optional
    contents:
      - src: ./README.md
        dst: /usr/share/doc/dibra/README.md

release:
  github:
    owner: Gjergj
    name: dibra
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

